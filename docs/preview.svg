<svg xmlns="http://www.w3.org/2000/svg" width="880" height="288" viewBox="0 0 880 288" role="img" aria-label="session-history terminal preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2630"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="287" rx="14" fill="url(#bg)" stroke="#30363d"/>

  <!-- title bar -->
  <path d="M0.5 14.5a14 14 0 0 1 14-14h851a14 14 0 0 1 14 14V40H0.5z" fill="url(#bar)"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="20" r="6" fill="#febc2e"/>
  <circle cx="70" cy="20" r="6" fill="#28c840"/>
  <text x="440" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12.5" fill="#8b949e">session-history — C:\Users\you\.dsh\sessions</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">
    <!-- prompt -->
    <text x="26" y="84" fill="#3fb950">$</text>
    <text x="44" y="84" fill="#e6edf3">node read_sessions.mjs list --limit 4</text>

    <!-- rows: every session below is fictional -->
    <text x="26" y="122" fill="#8b949e"> 1</text>
    <text x="62" y="122" fill="#8b949e">2026-11-03 10:42</text>
    <text x="226" y="122" fill="#58a6ff">9c2f1a04</text>
    <text x="300" y="122" fill="#d29922">(12 turns)</text>
    <text x="392" y="122" fill="#e6edf3">Refactor the storage layer</text>

    <text x="26" y="152" fill="#8b949e"> 2</text>
    <text x="62" y="152" fill="#8b949e">2026-11-03 10:25</text>
    <text x="226" y="152" fill="#58a6ff">41b7e3d8</text>
    <text x="300" y="152" fill="#d29922">(3 turns)</text>
    <text x="392" y="152" fill="#e6edf3">Why is the build so slow</text>

    <text x="26" y="182" fill="#8b949e"> 3</text>
    <text x="62" y="182" fill="#8b949e">2026-11-02 06:01</text>
    <text x="226" y="182" fill="#58a6ff">7a0c55e1</text>
    <text x="300" y="182" fill="#d29922">(7 turns)</text>
    <text x="392" y="182" fill="#e6edf3">Migrate CI to pnpm</text>

    <text x="26" y="212" fill="#8b949e"> 4</text>
    <text x="62" y="212" fill="#8b949e">2026-11-01 12:04</text>
    <text x="226" y="212" fill="#58a6ff">e8d4b2aa</text>
    <text x="300" y="212" fill="#d29922">(29 turns)</text>
    <text x="392" y="212" fill="#e6edf3">Ship 2.0 to the beta channel</text>

    <!-- second command -->
    <text x="26" y="256" fill="#3fb950">$</text>
    <text x="44" y="256" fill="#e6edf3">node read_sessions.mjs show e8d4b2aa --chars 60</text>
    <rect x="26" y="268" width="9" height="3" fill="#58a6ff"/>
  </g>
</svg>